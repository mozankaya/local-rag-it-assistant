services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: n8nio/n8n:2.29.10
    container_name: rag_n8n
    restart: unless-stopped

    ports:
      - "127.0.0.1:${N8N_PORT}:5678"

    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"

      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "1000"

    volumes:
      - n8n_data:/home/node/.n8n
      - ../data:/home/node/.n8n-files/data:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    image: izeltas-rag-backend:latest
    container_name: rag_backend
    restart: unless-stopped

    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"

    environment:
      ENVIRONMENT: docker

      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      N8N_RAG_WEBHOOK_URL: ${N8N_RAG_WEBHOOK_URL}
      N8N_FEEDBACK_WEBHOOK_URL: ${N8N_FEEDBACK_WEBHOOK_URL}
      N8N_REINDEX_WEBHOOK_URL: ${N8N_REINDEX_WEBHOOK_URL}

      N8N_HEALTH_URL: http://n8n:5678/healthz
      OLLAMA_HEALTH_URL: http://host.docker.internal:11434/api/tags

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

    volumes:
      - ../data:/workspace/data
      - ../scripts:/workspace/scripts:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started

    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
      ]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL}
        VITE_RAG_API_URL: ${VITE_RAG_API_URL}
        VITE_FEEDBACK_API_URL: ${VITE_FEEDBACK_API_URL}

    image: izeltas-rag-frontend:latest
    container_name: rag_frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"

    depends_on:
      backend:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  n8n_data: